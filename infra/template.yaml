AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vialo backend — itinerary engine (dev)

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Architectures:
      - arm64
    Tags:
      Project: vialo
      vialo: "true"
      Environment: dev
      ManagedBy: sam

Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  BedrockRegion:
    Type: String
    Default: us-east-1
  BedrockMonthlyBudgetUsd:
    Type: String
    Default: "5.00"
  BedrockInputUsdPerMillionTokens:
    Type: String
    Default: "4.00"
  BedrockOutputUsdPerMillionTokens:
    Type: String
    Default: "20.00"
  GoogleServerKey:
    Type: String
    NoEcho: true
  RateLimitHmacSecret:
    Type: String
    NoEcho: true
  ShareSigningSecret:
    Type: String
    NoEcho: true
  ShareDeletionSecret:
    Type: String
    NoEcho: true
  LogLevel:
    Type: String
    Default: INFO
  ApiCertificateArn:
    Type: String
    Description: ACM certificate ARN for api.vialo.place (us-east-1 regional)
    Default: ""
  FrontendCertificateArn:
    Type: String
    Description: ACM certificate ARN for vialo.place (us-east-1 for CloudFront)
    NoEcho: false

Conditions:
  HasApiCertificate: !Not [!Equals [!Ref ApiCertificateArn, ""]]

Resources:
  # --- Log Group (created before function to avoid race) ---
  VialoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vialo-backend-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  VialoApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/vialo-backend-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- IAM Role (explicit least-privilege) ---
  VialoFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vialo-backend-dev-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: vialo-cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${VialoLogGroup.Arn}:*"
        - PolicyName: vialo-dynamodb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt PlaceCacheTable.Arn
                  - !GetAtt SharedItinerariesTable.Arn
                  - !GetAtt RequestLimitsTable.Arn
        - PolicyName: vialo-bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6"
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- API ---
  VialoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn: !GetAtt VialoApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - "https://vialo.place"
          - "https://api.vialo.place"
        AllowMethods:
          - POST
          - GET
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Share-Delete-Token
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  # --- Custom Domain (conditional on certificate) ---
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCertificate
    Properties:
      DomainName: api.vialo.place
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
          CertificateArn: !Ref ApiCertificateArn
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCertificate
    DependsOn: VialoApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref VialoApi
      DomainName: !Ref ApiDomainName
      Stage: $default

  # --- Lambda Function ---
  VialoFunction:
    Type: AWS::Serverless::Function
    DependsOn: VialoLogGroup
    Properties:
      FunctionName: vialo-backend-dev
      Handler: vialo.handler.lambda_handler
      CodeUri: ../backend/src
      Role: !GetAtt VialoFunctionRole.Arn
      Layers:
        - !Ref VialoDepsLayer
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MONTHLY_BUDGET_USD: !Ref BedrockMonthlyBudgetUsd
          BEDROCK_INPUT_USD_PER_MILLION_TOKENS: !Ref BedrockInputUsdPerMillionTokens
          BEDROCK_OUTPUT_USD_PER_MILLION_TOKENS: !Ref BedrockOutputUsdPerMillionTokens
          GOOGLE_SERVER_KEY: !Ref GoogleServerKey
          DYNAMODB_TABLE_CACHE: !Ref PlaceCacheTable
          DYNAMODB_TABLE_SHARES: !Ref SharedItinerariesTable
          DYNAMODB_TABLE_RATE_LIMITS: !Ref RequestLimitsTable
          RATE_LIMIT_HMAC_SECRET: !Ref RateLimitHmacSecret
          SHARE_SIGNING_SECRET: !Ref ShareSigningSecret
          SHARE_DELETION_SECRET: !Ref ShareDeletionSecret
          POWERTOOLS_SERVICE_NAME: vialo-api
          LOG_LEVEL: !Ref LogLevel
      Events:
        PlanItinerary:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/itineraries
            Method: POST
        CreateShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares
            Method: POST
        GetShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares/{shareId}
            Method: GET
        DeleteShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares/{shareId}
            Method: DELETE
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  # --- Layer ---
  # NOTE: AWS::Serverless::LayerVersion does not support the Tags property.
  # Layer-version tagging is unsupported through CloudFormation or the Lambda tagging API.
  VialoDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: vialo-deps-dev
      ContentUri: ../backend/layer/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # --- DynamoDB Tables (on-demand, PITR off) ---
  PlaceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-place-cache-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  SharedItinerariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-shared-itineraries-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: "vialo"
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  RequestLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-request-limits-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- Frontend Hosting ---

  # S3 bucket — private, encrypted, no website hosting, no public ACL
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "vialo-frontend-${AWS::AccountId}-${AWS::Region}-dev"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # OAC for CloudFront → S3 access
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: vialo-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy — only the CloudFront distribution can read objects
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # CloudFront Function — SPA rewrite for extensionless non-API paths
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: vialo-spa-rewrite
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // Do not rewrite /api/* paths
          if (uri.startsWith('/api/')) {
            return request;
          }
          // Do not rewrite files with extensions (real assets)
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) {
            return request;
          }
          // SPA fallback: rewrite extensionless paths to /index.html
          request.uri = '/index.html';
          return request;
        }
      FunctionConfig:
        Comment: "Vialo SPA rewrite — extensionless non-API paths to /index.html"
        Runtime: cloudfront-js-2.0

  # Response headers policy — strict CSP compatible with Google Maps JS + self-hosted fonts
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: vialo-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://maps.google.com data: blob:; connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com; frame-src https://www.google.com https://maps.google.com; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Override: true

  # CloudFront Distribution — vialo.place
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "Vialo frontend — vialo.place"
        Aliases:
          - vialo.place
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        # Default origin — S3 via OAC
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOAC.Id
          - Id: ApiOrigin
            DomainName: api.vialo.place
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

Outputs:
  ApiUrl:
    Description: API Gateway execute-api URL
    Value: !Sub "https://${VialoApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt VialoFunction.Arn
  ApiCustomUrl:
    Condition: HasApiCertificate
    Description: Custom domain URL for the API
    Value: "https://api.vialo.place"
  ApiDnsTarget:
    Condition: HasApiCertificate
    Description: DNS target for CNAME/ALIAS record to api.vialo.place
    Value: !GetAtt ApiDomainName.RegionalDomainName
  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for frontend
    Value: !Ref FrontendDistribution
  FrontendDistributionDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: Production frontend URL
    Value: "https://vialo.place"
