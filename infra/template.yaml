AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Vialo backend — itinerary engine (dev)

Globals:
  Function:
    Runtime: python3.12
    # 1769 MB is one full vCPU. Chosen from the deployed ARM64 solver benchmark
    # (docs/kiro-evidence/solver-benchmark/): the worst-case 9-stop exhaustive
    # search plus progressive dropping takes 11.98 s at 512 MB and 3.53 s here,
    # which keeps a full 9-stop request inside the 30 s API Gateway budget.
    MemorySize: 1769
    Timeout: 30
    Architectures:
      - arm64
    Tags:
      Project: vialo
      vialo: "true"
      Environment: dev
      ManagedBy: sam

Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  BedrockRegion:
    Type: String
    Default: us-east-1
  BedrockMonthlyBudgetUsd:
    Type: String
    Default: "5.00"
  BedrockInputUsdPerMillionTokens:
    Type: String
    Default: "4.00"
  BedrockOutputUsdPerMillionTokens:
    Type: String
    Default: "20.00"
  GoogleServerKey:
    Type: String
    NoEcho: true
  RateLimitHmacSecret:
    Type: String
    NoEcho: true
  ShareSigningSecret:
    Type: String
    NoEcho: true
  ShareDeletionSecret:
    Type: String
    NoEcho: true
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted-UI domain prefix for Vialo Journal
    Default: vialo-place-journal
  LogLevel:
    Type: String
    Default: INFO
  ApiCertificateArn:
    Type: String
    Description: ACM certificate ARN for api.vialo.place (us-east-1 regional)
    Default: ""
  FrontendCertificateArn:
    Type: String
    Description: ACM certificate ARN for vialo.place (us-east-1 for CloudFront)
    NoEcho: false

Conditions:
  HasApiCertificate: !Not [!Equals [!Ref ApiCertificateArn, ""]]

Resources:
  # --- Log Group (created before function to avoid race) ---
  VialoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vialo-backend-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  VialoApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/vialo-backend-dev
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- IAM Role (explicit least-privilege) ---
  VialoFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vialo-backend-dev-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: vialo-cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${VialoLogGroup.Arn}:*"
        - PolicyName: vialo-dynamodb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt PlaceCacheTable.Arn
                  - !GetAtt SharedItinerariesTable.Arn
                  - !GetAtt RequestLimitsTable.Arn
                  - !GetAtt JournalTable.Arn
                  - !Sub "${JournalTable.Arn}/index/*"
        - PolicyName: vialo-journal-media-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Presigning inherits the signer's permission, so the function may
              # only create cover objects. It can never read or delete them.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${JournalMediaBucket.Arn}/covers/*"
        - PolicyName: vialo-bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6"
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- API ---
  VialoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn: !GetAtt VialoApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
      CorsConfiguration:
        AllowOrigins:
          - "https://vialo.place"
          - "https://api.vialo.place"
        AllowMethods:
          - POST
          - GET
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Share-Delete-Token
          - Authorization
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  # --- Custom Domain (conditional on certificate) ---
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCertificate
    Properties:
      DomainName: api.vialo.place
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
          CertificateArn: !Ref ApiCertificateArn
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCertificate
    DependsOn: VialoApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref VialoApi
      DomainName: !Ref ApiDomainName
      Stage: $default

  # --- Lambda Function ---
  VialoFunction:
    Type: AWS::Serverless::Function
    DependsOn: VialoLogGroup
    Properties:
      FunctionName: vialo-backend-dev
      Handler: vialo.handler.lambda_handler
      CodeUri: ../backend/src
      Role: !GetAtt VialoFunctionRole.Arn
      Layers:
        - !Ref VialoDepsLayer
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MONTHLY_BUDGET_USD: !Ref BedrockMonthlyBudgetUsd
          BEDROCK_INPUT_USD_PER_MILLION_TOKENS: !Ref BedrockInputUsdPerMillionTokens
          BEDROCK_OUTPUT_USD_PER_MILLION_TOKENS: !Ref BedrockOutputUsdPerMillionTokens
          GOOGLE_SERVER_KEY: !Ref GoogleServerKey
          DYNAMODB_TABLE_CACHE: !Ref PlaceCacheTable
          DYNAMODB_TABLE_SHARES: !Ref SharedItinerariesTable
          DYNAMODB_TABLE_RATE_LIMITS: !Ref RequestLimitsTable
          RATE_LIMIT_HMAC_SECRET: !Ref RateLimitHmacSecret
          SHARE_SIGNING_SECRET: !Ref ShareSigningSecret
          SHARE_DELETION_SECRET: !Ref ShareDeletionSecret
          DYNAMODB_TABLE_BLOG: !Ref JournalTable
          MEDIA_BUCKET: !Ref JournalMediaBucket
          MEDIA_BASE_URL: /media
          COGNITO_USER_POOL_ID: !Ref JournalUserPool
          COGNITO_CLIENT_ID: !Ref JournalUserPoolClient
          COGNITO_REGION: !Ref AWS::Region
          POWERTOOLS_SERVICE_NAME: vialo-api
          LOG_LEVEL: !Ref LogLevel
      Events:
        PlanItinerary:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/itineraries
            Method: POST
        CreateShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares
            Method: POST
        GetShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares/{shareId}
            Method: GET
        DeleteShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/shares/{shareId}
            Method: DELETE
        PlacesAutocomplete:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/places/autocomplete
            Method: POST
        PlacesLookup:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/places/lookup
            Method: POST
        PhotoProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/photos
            Method: GET
        JournalListPosts:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts
            Method: GET
        JournalCreatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts
            Method: POST
        JournalGetPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}
            Method: GET
        JournalDeletePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}
            Method: DELETE
        JournalListComments:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}/comments
            Method: GET
        JournalCreateComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}/comments
            Method: POST
        JournalDeleteComment:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}/comments/{commentId}
            Method: DELETE
        JournalReportPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/posts/{postId}/report
            Method: POST
        JournalUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/uploads
            Method: POST
        JournalViewer:
          Type: HttpApi
          Properties:
            ApiId: !Ref VialoApi
            Path: /api/blog/me
            Method: GET
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  # --- Layer ---
  # NOTE: AWS::Serverless::LayerVersion does not support the Tags property.
  # Layer-version tagging is unsupported through CloudFormation or the Lambda tagging API.
  VialoDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: vialo-deps-dev
      ContentUri: ../backend/layer/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # --- DynamoDB Tables (on-demand, PITR off) ---
  PlaceCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-place-cache-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  SharedItinerariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-shared-itineraries-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: "vialo"
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  RequestLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-request-limits-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # --- Vialo Journal: table, media bucket, and user pool ---
  # Journal data is deliberately separate from the place cache, anonymous shares,
  # and rate limits: different retention, different access pattern, different
  # blast radius. Three GSIs serve the feed, one city, and one author, and each
  # projects only listing attributes so a feed query never reads a story body.
  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vialo-journal-dev
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
        - AttributeName: gsi3pk
          AttributeType: S
        - AttributeName: gsi3sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: &journalListingAttributes
              - postId
              - title
              - city
              - cityKey
              - excerpt
              - coverImageKey
              - authorId
              - authorName
              - createdAt
              - commentCount
              - hasRoute
              - stopCount
              - hidden
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: *journalListingAttributes
        - IndexName: gsi3
          KeySchema:
            - AttributeName: gsi3pk
              KeyType: HASH
            - AttributeName: gsi3sk
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: *journalListingAttributes
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  JournalMediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "vialo-journal-media-${AWS::AccountId}-${AWS::Region}-dev"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - https://vialo.place
            AllowedMethods:
              - POST
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  JournalMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JournalMediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${JournalMediaBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # Sign-up is intentionally minimal: email plus password, no verification code.
  # The PreSignUp trigger confirms the account immediately. The email is only a
  # login identifier; it is never stored in the Journal table or returned by the API.
  JournalAutoConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: vialo-journal-autoconfirm-dev
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      InlineCode: |
        def handler(event, context):
            """Confirm new Journal accounts without an emailed code."""
            event["response"]["autoConfirmUser"] = True
            if event.get("request", {}).get("userAttributes", {}).get("email"):
                event["response"]["autoVerifyEmail"] = True
            return event
      Tags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  JournalAutoConfirmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JournalAutoConfirmFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt JournalUserPool.Arn

  JournalUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: vialo-journal-dev
      UsernameAttributes:
        - email
      LambdaConfig:
        PreSignUp: !GetAtt JournalAutoConfirmFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: nickname
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Project: vialo
        vialo: "true"
        Environment: dev
        ManagedBy: sam

  JournalUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: vialo-journal-web
      UserPoolId: !Ref JournalUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - https://vialo.place/auth/callback
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - https://vialo.place/journal
        - http://localhost:5173/journal
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  JournalUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref JournalUserPool

  # --- Frontend Hosting ---

  # S3 bucket — private, encrypted, no website hosting, no public ACL
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "vialo-frontend-${AWS::AccountId}-${AWS::Region}-dev"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

  # OAC for CloudFront → S3 access
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: vialo-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy — only the CloudFront distribution can read objects
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # CloudFront Function — SPA rewrite for extensionless non-API paths
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: vialo-spa-rewrite
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // Do not rewrite /api/* paths
          if (uri.startsWith('/api/')) {
            return request;
          }
          // Do not rewrite files with extensions (real assets)
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) {
            return request;
          }
          // SPA fallback: rewrite extensionless paths to /index.html
          request.uri = '/index.html';
          return request;
        }
      FunctionConfig:
        Comment: "Vialo SPA rewrite — extensionless non-API paths to /index.html"
        Runtime: cloudfront-js-2.0

  # CloudFront Function — strip the /media prefix so keys map to bucket objects
  JournalMediaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: vialo-journal-media-rewrite
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/media/, '');
          return request;
        }
      FunctionConfig:
        Comment: "Vialo Journal media — map /media/<key> to the bucket key"
        Runtime: cloudfront-js-2.0

  # Response headers policy — strict CSP compatible with Google Maps JS + self-hosted fonts
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: vialo-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://*.googleusercontent.com https://maps.google.com data: blob:; connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://cognito-idp.${AWS::Region}.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com https://vialo-journal-media-${AWS::AccountId}-${AWS::Region}-dev.s3.amazonaws.com https://vialo-journal-media-${AWS::AccountId}-${AWS::Region}-dev.s3.${AWS::Region}.amazonaws.com; frame-src https://www.google.com https://maps.google.com; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Override: true

  # CloudFront Distribution — vialo.place
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "Vialo frontend — vialo.place"
        Aliases:
          - vialo.place
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        # Default origin — S3 via OAC
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOAC.Id
          - Id: JournalMediaOrigin
            DomainName: !GetAtt JournalMediaBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOAC.Id
          - Id: ApiOrigin
            DomainName: api.vialo.place
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          # Journal cover images: private bucket, read only through this distribution.
          - PathPattern: /media/*
            TargetOriginId: JournalMediaOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt JournalMediaRewriteFunction.FunctionARN
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
      Tags:
        - Key: Project
          Value: vialo
        - Key: vialo
          Value: "true"
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: sam

Outputs:
  ApiUrl:
    Description: API Gateway execute-api URL
    Value: !Sub "https://${VialoApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt VialoFunction.Arn
  ApiCustomUrl:
    Condition: HasApiCertificate
    Description: Custom domain URL for the API
    Value: "https://api.vialo.place"
  ApiDnsTarget:
    Condition: HasApiCertificate
    Description: DNS target for CNAME/ALIAS record to api.vialo.place
    Value: !GetAtt ApiDomainName.RegionalDomainName
  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for frontend
    Value: !Ref FrontendDistribution
  FrontendDistributionDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: Production frontend URL
    Value: "https://vialo.place"
  JournalTableName:
    Description: DynamoDB table for Vialo Journal posts and comments
    Value: !Ref JournalTable
  JournalMediaBucketName:
    Description: Private S3 bucket for Journal cover images
    Value: !Ref JournalMediaBucket
  JournalUserPoolId:
    Description: Cognito user pool for Vialo Journal
    Value: !Ref JournalUserPool
  JournalUserPoolClientId:
    Description: Cognito app client for the Vialo Journal SPA
    Value: !Ref JournalUserPoolClient
  JournalAuthDomain:
    Description: Cognito hosted UI domain for Vialo Journal
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
