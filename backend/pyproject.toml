[project]
name = "vialo"
version = "0.1.0"
description = "Vialo itinerary engine — constraint solver for one day in a city"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.7",
    "aws-lambda-powertools==3.14.0",
    "httpx==0.28.1",
    "boto3==1.38.34",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.1.1",
    "hypothesis==6.130.5",
    "moto[dynamodb]==5.1.3",
    "respx==0.22.0",
    "ruff==0.11.12",
    "mypy==1.15.0",
    "boto3-stubs[dynamodb]==1.38.34",
    "time-machine==2.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["layer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "moto.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "time_machine.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vialo"]
